name: Cloudflare secret presence probe
on:
  push:
    paths: ['.github/workflows/cloudflare-secret-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      A: ${{ secrets.CF_DNS_EDIT }}
      B: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      C: ${{ secrets.CLOUDFLARE }}
      D: ${{ secrets.CF_API_TOKEN }}
      E: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
    steps:
      - shell: bash
        run: |
          for k in A B C D E; do
            v="${!k}"
            if [ -n "$v" ]; then echo "$k=PRESENT"; else echo "$k=ABSENT"; fi
          done
